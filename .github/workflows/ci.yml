name: CI

on:
    # We run CI on pushes to the main branch
    push:
        branches:
            - main
    # and on all pull requests to the main branch
    pull_request:
        branches:
            - main
    # as well as upon manual triggers through the 'Actions' tab of the Github UI
    workflow_dispatch:

env:
    SMARTRODENT_SKIP_VLM_INTEGRATION: "1"

jobs:
    build-and-test:
        name: Testing on ${{matrix.os}}
        runs-on: ${{matrix.os}}
        strategy:
            matrix:
                os: [ubuntu-latest]
                # Here, we are testing the oldest and the newest supported Python version.
                # If this is insufficient for your package, consider adding more versions.
                python-version: ["3.13", "3.14"]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  # setuptools_scm requires a non-shallow clone of the repository
                  fetch-depth: 0

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Set up uv
              uses: astral-sh/setup-uv@v6
              with:
                  enable-cache: true

            - name: Install Python package
              run: |
                  uv sync --extra dev --frozen

            - name: Run Python tests
              run: |
                  uv run pytest

    coverage:
        name: Coverage Testing
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - uses: actions/setup-python@v6
              with:
                  python-version: "3.13"

            - name: Set up uv
              uses: astral-sh/setup-uv@v6
              with:
                  enable-cache: true

            - name: Install Python package
              run: |
                  uv sync --extra dev --frozen

            - name: Run Python tests
              working-directory: ./tests
              run: |
                  uv run pytest --cov --cov-report=xml

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v5
              with:
                  fail_ci_if_error: true
                  files: ./tests/coverage.xml
