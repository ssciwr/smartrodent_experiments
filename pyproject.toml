[project]
name = "rodent-experiments"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dvc>=3.67.1",
    "numpy>=2.4.6",
    "ollama>=0.6.2",
    "pandas>=3.0.3",
    "PyYAML>=6.0",
    "tqdm>=4.69.0",
    "ultralytics>=8.4.68",
    "requests>=2.0",
    "pyinaturalist>=0.21.1",
    "pygbif>=0.6.6",
    "python-dotenv>=1.0",
    "mlflow>=3.16.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "coverage",
    "pre-commit",
    "pytest-mock",
    "hypothesis",
]

vllm = [
    "vllm==0.28.0",
] # needs uv pip install "vllm==0.28.0" --torch-backend=auto to resolve bug: https://github.com/vllm-project/vllm/issues/58236

[tool.pytest]
# Script entry points live outside the installed src package.
pythonpath = ["."]
markers = [
    "network: test hits the live iNaturalist API (deselect with -m 'not network')",
    "vlm_integration: test requires a real Ollama server or vLLM-capable GPU",
]

[tool.coverage.run]
branch = true
source = ["./src/smartrodent"]
omit = ["tests/*"]

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_also = [
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",

    # Don't complain if non-runnable code isn't run:
    "if __name__ == .__main__.:",

    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
]
fail_under = 80

[tool.coverage.html]
directory = "coverage_html_report"
