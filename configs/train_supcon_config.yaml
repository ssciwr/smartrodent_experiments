# Run from the repository root:
# python scripts/train_supcon.py configs/train_supcon_config.yaml
train_dataset: datasets/stage8_yolo_classifier_not_oversampled/train
validation_dataset: datasets/stage8_yolo_classifier_not_oversampled/val
output_directory: runs/supcon_standalone_xl
model_name: notebooks/yolo26x-cls.pt
mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: smartrodent-standalone-supcon
  registered_model_name: rodent-species
  model_artifact_name: classifier
  champion_alias: champion
  # Set this to the immutable DVC/data revision used for the run when available.
  # dataset_revision: <revision>
class_names:
  - Rattus norvegicus # brown rat
  - Rattus rattus # black rat
  - Mus musculus # house mouse
  - Apodemus agrarius # striped field mouse
  - Apodemus flavicollis # yellow-necked field mouse
  - Apodemus sylvaticus # wood mouse
  - Arvicola amphibius #
  - Microtus arvalis #
  - Clethrionomys glareolus #
  - Microtus agrestis #
  - Crocidura leucodon #
  - Sorex araneus #
  - Sorex minutus #
  - Sorex coronatus #
  # rodents in sri lanka
  - Suncus murinus #
  - Bandicota indica # greater bandicot rat
  - Bandicota bengalensis # lessert bandicot rat
  - Mus booduga # little indian field mouse
  - Vandeleuria oleraceus #
  # snakes
  - Vipera berus # common european adder
  - Coronella austriaca # smooth snake
  - Natrix natrix # grass snake
  - Natrix helvetica # barred grass snake
  # snakes in sri lanka
  - Ptyas mucosa #
  - Bungarus caeruleus #
  - Naja naja #
  - Daboia russelii #
  - Coelognathus helena #
  # predators from sri lanka
  - Spilornis cheela
  - Varanus bengalensis #
  - Centropus sinensis #
  - Pavo cristatus # peacock
  # predators of snakes and rodents (birds, mammals )
  - Vulpes vulpes # red fox
  - Buteo buteo # common buzzard
  - Meles meles # european badger
  - Ciconia ciconia # white stork
  - Ardea cinerea # grey heron
  - Felis catus # house cat
  - Canis familiaris # domestic dog
epochs: 30
transforms:
  image_size: 448
  resize:
    interpolation: bilinear
    antialias: true
  random_adjust_sharpness:
    sharpness_factor: 0.5
    p: 0.2
  random_grayscale:
    p: 0.2
  random_perspective:
    distortion_scale: 0.5
    p: 0.2
    interpolation: bilinear
    fill: 0
  random_horizontal_flip:
    p: 0.2
  random_resized_crop:
    scale: [0.75, 1.0]
    ratio: [0.75, 1.3333333333333333]
    interpolation: bilinear
    antialias: true
optimizer:
  lr: !sweep
    values:
      - 0.0001
      - 0.0005
      - 0.001
  betas: [0.9, 0.999]
  eps: 1.0e-08
  weight_decay: 0.01
  amsgrad: false
classes_per_batch: 4
samples_per_class: 4
# Matches the notebook sampler's default; rounded down to complete source batches.
samples_per_epoch: 100000
workers: 20
prefetch_factor: 4
seed: 42
device: cuda
dropout: 0.0
output_features: 128
temperature: 0.1
freeze: []
log_every: 10
validation_metrics:
  accuracy:
    function: accuracy_score
  balanced_accuracy:
    function: balanced_accuracy_score
  f1_macro:
    function: f1_score
    average: macro
    zero_division: 0
tracked_metric: supcon_loss_mean # not defined means track supcon_loss
scheduler:
  name: ReduceLROnPlateau
  parameters:
    mode: min
    factor: 0.5
    # PyTorch reduces after patience + 1 non-improving epochs.
    patience: 2
    threshold: 0.001
    threshold_mode: abs
    min_lr: 0.000001
    cooldown: 0
early_stopping:
  patience: 5
  tolerance: 0.001
  comparison: less
