# Run from the repository root:
# python scripts/train_supcon.py configs/train_supcon_config.yaml
train_dataset: datasets/stage8_yolo_classifier_srilanka/train
validation_dataset: datasets/stage8_yolo_classifier_srilanka/val
output_directory: runs/supcon_standalone_xl_srilanka_lr-00001
model_name: ./yolo26x-cls.pt
mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: lr-tau-supcon-xl
  registered_model_name: species-classifier-encoder-xl
  model_artifact_name: species-classifier-encoder-xl
  champion_alias: champion
  # Set this to the immutable DVC/data revision used for the run when available.
  # dataset_revision: <revision>
class_names:
  - Rattus rattus # brown rat
  - Bandicota bengalensis # lesser bandicot rat
  - Bandicota indica # greater bandicot rat
  - Mus booduga # little indian field mouse
  - Vandeleuria oleraceus # climbing mouse
  - Tatera indica # indian gerbil
  - Suncus murinus # shrew
  - Ptyas mucosa # indian rat snake
  - Python molurus # rock python
  - Naja naja # indian cobra
  - Tyto javanica # eastern barn owl
  - Ninox scutulata # brown boobook
  - Glaucidium radiatum # jungle owlet
  - Ketupa zeylonensis # Brown fish owl
  - Ketupa nipalensis # spot-bellied eagle-owl
  - Glaucidium castanotum # chestnut-backed owlet
  - Otus thilohoffmanni # Serendib scops-owl
  - Milvus migrans # Black kite
  - Accipiter virgatus # common kestrel
  - Falco tinnunculus # besra
  - Urva edwardsii # Indian grey mongoose
  - Felis catus # house cat
  - Canis familiaris # domestic dog
epochs: 30
transforms:
  image_size: 448
  resize:
    interpolation: bilinear
    antialias: true
  random_adjust_sharpness:
    sharpness_factor: 0.5
    p: 0.2
  random_grayscale:
    p: 0.2
  random_perspective:
    distortion_scale: 0.5
    p: 0.2
    interpolation: bilinear
    fill: 0
  random_horizontal_flip:
    p: 0.2
  random_resized_crop:
    scale: [0.75, 1.0]
    ratio: [0.75, 1.3333333333333333]
    interpolation: bilinear
    antialias: true
optimizer:
  lr: 0.0001
  betas: [0.9, 0.999]
  eps: 1.0e-08
  weight_decay: 0.01
  amsgrad: false
classes_per_batch: 8
samples_per_class: 6
# Matches the notebook sampler's default; rounded down to complete source batches.
samples_per_epoch: 100000
workers: 20
prefetch_factor: 4
seed: 42
device: cuda
dropout: 0.0
output_features: 128
temperature: 0.1
freeze: []
log_every: 10
validation_metrics:
  accuracy:
    function: accuracy_score
  balanced_accuracy:
    function: balanced_accuracy_score
  f1_macro:
    function: f1_score
    average: macro
    zero_division: 0
tracked_metric: supcon_loss_mean # not defined means track supcon_loss
scheduler:
  name: ReduceLROnPlateau
  parameters:
    mode: min
    factor: 0.5
    # PyTorch reduces after patience + 1 non-improving epochs.
    patience: 2
    threshold: 0.001
    threshold_mode: abs
    min_lr: 0.000001
    cooldown: 0
early_stopping:
  patience: 6
  tolerance: 0.005
  comparison: less
