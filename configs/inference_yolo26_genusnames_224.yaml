# SpeciesNet animal detection followed by the 224-pixel YOLO26 genus classifier.
inference:
  detector: speciesnet
  classifier: yolo26

  detector_kwargs:
    model: kaggle:google/speciesnet/pyTorch/v4.0.3b/1
    conf: 0.01

  classifier_kwargs:
    model: ../models/yolo26_genusnames_classifier_xl_224.pt
    max_top_k: 5
    imgsz: 224
    verbose: false

  # Genus targets derived from create_speciesnet_classifier_dataset.py.
  # Canis, Felis, and Car are training distractors and are excluded.
  classes:
    - Apodemus
    - Ardea
    - Arvicola
    - Bandicota
    - Bungarus
    - Buteo buteo
    - Centropus
    - Ciconia
    - Clethrionomys
    - Coelognathus
    - Coronella
    - Crocidura
    - Daboia
    - Meles
    - Microtus
    - Mus
    - Naja
    - Natrix
    - Pavo
    - Ptyas
    - Rattus
    - Sorex
    - Spilornis
    - Suncus
    - Vandeleuria
    - Varanus
    - Vipera
    - Vulpes

  class_mappings: {}
