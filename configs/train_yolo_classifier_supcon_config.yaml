train_dataset: datasets/stage8_yolo_classifier
model_name: yolo26x-cls.pt
include_macro_f1: true
return_format: dataframe

supcon:
  enabled: true
  classes_per_batch: 8
  samples_per_class: 6
  epoch_size: null
  projection_hidden_dimension: 512
  embedding_dimension: 128
  temperature: 0.1
  cross_entropy_weight: 1.0
  contrastive_weight: 0.1

mlflow:
  tracking_uri: sqlite:///mlflow.db
  train_experiment_name: smartrodent-yolo-classifier-supcon-training
  tune_experiment_name: smartrodent-yolo-classifier-supcon-tuning

train_kwargs:
  epochs: 200
  imgsz: 640
  device: 0
  workers: 10
  patience: 10
  warmup_epochs: 3.0
  optimizer: auto
  project: ./projects/training/classification/xl_speciesnames_supcon
  name: full_data_classifier_xl_640_supcon
  exist_ok: true
  plots: true
  save: true
  val: true
  scale: 0.8
  fliplr: 0.5
  flipud: 0.2
  auto_augment: autoaugment
  erasing: 0.1
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.0
  cls_pw: 0.5

export_kwargs:
  format: onnx
