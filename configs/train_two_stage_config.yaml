# python scripts/train_two_stage.py configs/train_two_stage_config.yaml
# Sweepable stage values: scalar | !sweep {values: [...]}.
# !coupled-sweep pairs values with another sweep identified by its full dotted path.
output_directory: runs/two_stage_xl_srilanka  # Directory path.

data:
  train_dataset: datasets/stage8_yolo_classifier_srilanka/train  # Class-folder split path.
  validation_dataset: datasets/stage8_yolo_classifier_srilanka/val  # Class-folder split path.
  class_names:  # List of unique species-directory names.
    - Rattus rattus
    - Rattus norvegicus
    - Bandicota bengalensis
    - Bandicota indica
    - Mus booduga
    - Mus musculus
    - Vandeleuria oleraceus
    - Tatera indica
    - Suncus murinus
    - Ptyas mucosa
    - Python molurus
    - Naja naja
    - Tyto javanica
    - Ninox scutulata
    - Glaucidium radiatum
    - Ketupa zeylonensis
    - Ketupa nipalensis
    - Glaucidium castanotum
    - Otus thilohoffmanni
    - Milvus migrans
    - Accipiter virgatus
    - Falco tinnunculus
    - Urva edwardsii
    - Felis catus
    - Canis familiaris
    - Pavo cristatus

supcon:
  model_name: ./yolo26x-cls.pt  # YOLO classification checkpoint (.pt) or architecture YAML.
  epochs: 30  # Integer >0.
  transforms: &tf  # torchvision v2 keyword arguments.
    image_size: 640 # Integer >0; square image size.
    resize:
      interpolation: bilinear  # nearest | nearest-exact | bilinear | bicubic
      antialias: true  # true | false
    random_adjust_sharpness:
      sharpness_factor: 0.5  # >=0: 0=blur, 1=unchanged, >1=sharpen.
      p: 0.2  # Probability in [0, 1]: 0=off, 1=always.
    random_grayscale:
      p: 0.2  # Probability in [0, 1].
    random_perspective:
      distortion_scale: 0.5  # Float in [0, 1].
      p: 0.2  # Probability in [0, 1].
      interpolation: bilinear  # nearest | bilinear
      fill: 0  # Scalar or per-channel fill values.
    random_horizontal_flip:
      p: 0.2  # Probability in [0, 1].
    random_resized_crop:
      scale: [0.75, 1.0]  # [min, max] crop-area fractions.
      ratio: [0.75, 1.3333333333333333]  # [min, max] aspect ratios.
      interpolation: bilinear  # nearest | nearest-exact | bilinear | bicubic
      antialias: true  # true | false
  optimizer:  # AdamW keyword arguments; also accepts native options such as foreach/fused.
    lr: 0.0001  # Float >0.
    betas: [0.9, 0.999]  # Two moment-decay rates, each in [0, 1).
    eps: 1.0e-08  # Nonnegative numerical-stability term.
    weight_decay: 0.01  # Float >=0.
    amsgrad: false  # true | false
  classes_per_batch: 6  # Integer >=2; distinct classes per batch (P).
  samples_per_class: 6  # Integer >=1; source images per class (M).
  samples_per_epoch: 100000  # Integer >=P*M; source-image selections per epoch.
  workers: 20  # Integer >=0; 0=main process, >0=worker processes.
  prefetch_factor: 4  # Integer >0; batches prefetched per worker.
  seed: 42  # Integer in [0, 2**32).
  device: cuda  # cpu | cuda | cuda:N | another available PyTorch device.
  dropout: 0.0  # Projection-head dropout probability in [0, 1].
  output_features: 128  # Integer >0; projection dimension.
  temperature: 0.1  # Float >0; SupCon temperature.
  freeze: []  # List of layer indices: []=none frozen, e.g. [0, 1].
  log_every: 10  # Integer >0; progress-log interval in steps.
  validation_metrics:  # Named sklearn scorer specifications | null (native losses only).
    accuracy:
      function: accuracy_score  # sklearn.metrics function returning a scalar from labels.
    balanced_accuracy:
      function: balanced_accuracy_score
    f1_macro:
      function: f1_score
      average: macro  # binary | micro | macro | weighted
      zero_division: 0  # warn | 0 | 1 | .nan
  # Options: supcon_loss_min | supcon_loss_mean | supcon_loss_std |
  # supcon_loss_max | a validation_metrics alias. Default: supcon_loss_mean.
  tracked_metric: supcon_loss_mean
  tracked_mode: min  # min | max | null (infer direction).
  scheduler:  # Scheduler settings | null (constant learning rate).
    name: ReduceLROnPlateau  # Supported scheduler: ReduceLROnPlateau.
    parameters:
      mode: min  # min | max
      factor: 0.5  # Float strictly between 0 and 1.
      patience: 2  # Integer >=0; bad epochs tolerated.
      threshold: 0.001  # Float >=0; improvement threshold.
      threshold_mode: abs  # abs | rel
      min_lr: 0.000001  # Float >=0; learning-rate floor.
      cooldown: 0  # Integer >=0; cooldown epochs.
      # eps: 1.0e-08  # Optional float >=0; minimum learning-rate change.
  early_stopping:  # Stopping settings | null (disabled).
    patience: 6  # Integer >0; consecutive insufficient improvements.
    tolerance: 0.005  # Float >=0; absolute improvement tolerance.
    comparison: less  # less (minimize) | greater (maximize)
  # model_card_template: configs/model_card_template.yaml  # Optional template path.

classifier:
  initialization:
    encoder:
      source: selected_supcon
    head:
      replace: !sweep  # linear (final Linear layer) | full (entire Classify block)
        values:
          - linear
          - full
      source: !sweep  # random (fresh weights) | yolo_checkpoint (donor weights)
        values:
          - random
          - yolo_checkpoint
      checkpoint: !coupled-sweep  # null (random) | native YOLO classifier checkpoint path
        target: classifier.initialization.head.source  # Full dotted path of the paired sweep.
        values:
          - null
          - ./yolo26x-cls.pt
  # Layer count N (freezes layers 0..N-1) | list of unique layer indices | 0 / [] (train all).
  # YOLO26-cls has 11 layers: 0-9 encoder, 10 = Classify head. Index 10 is only valid with
  # replace=linear and freezes the head's conv, so only Linear trains (linear probe).
  freeze: !coupled-sweep  # Linear probe (11) | frozen encoder with trainable full head (10).
    target: classifier.initialization.head.replace
    values: [11, 10]
  encoder_batchnorm: eval  # Frozen layers' BN: eval (fixed) | adapt (update); omit when nothing is frozen.
  epochs: 30  # Integer >0.
  batch_size: 48  # Integer >0; single-view CE batch size.
  workers: 20  # Integer >=0; 0=main process, >0=worker processes.
  device: cuda  # cpu | cuda | cuda:N | another available PyTorch device.
  seed: 42  # Integer in [0, 2**32).
  transforms: *tf
  train_kwargs:  # Native Ultralytics options; shared paths/batch/device/seed stay outside this mapping.
    optimizer: AdamW  # auto | Adam | Adamax | AdamW | NAdam | RAdam | RMSprop | SGD | MuSGD
    lr0: 0.0005  # Positive initial learning rate; auto chooses its own rate.
    momentum: 0.9  # SGD momentum / Adam first-moment decay.
    weight_decay: 0.01  # Nonnegative native weight decay.
    cos_lr: false  # false=linear LR schedule; true=cosine.
    lrf: 0.01  # Final learning rate as a fraction of lr0; 1 keeps it constant after warmup.
    warmup_epochs: 0.0  # Nonnegative warmup duration; fractional epochs are supported.
    patience: 6  # Native early-stopping patience; 0 disables stopping.
    amp: false  # false/fp32=FP32; true/fp16=AMP; bf16=BF16 AMP.
    plots: false  # true writes native diagnostic plots.
  validation_metrics:  # Named sklearn scorer specifications | null (CE loss only).
    accuracy:
      function: accuracy_score  # sklearn.metrics function returning a scalar from labels.
    balanced_accuracy:
      function: balanced_accuracy_score
    f1_macro:
      function: f1_score
      average: macro  # binary | micro | macro | weighted
      zero_division: 0  # warn | 0 | 1 | .nan
  tracked_metric: balanced_accuracy  # ce_loss_mean | a validation_metrics alias.
  tracked_mode: max  # min | max | null (infer direction).
  # model_card_template: configs/model_card_template.yaml  # Optional template path.

mlflow:  # Tracking settings | null (disabled).
  tracking_uri: sqlite:///mlflow.db  # SQLite URI | HTTP(S) tracking-server URI.
  experiment_name: two-stage-sri-lanka-xl  # Nonempty experiment-name string.
  registered_model_name: species-classifier-xl  # Nonempty model name | null (no registration).
  model_artifact_name: species-classifier-xl  # Nonempty logged-model name.
  champion_alias: champion  # Nonempty registered-model alias.
  # dataset_revision: <immutable-data-revision>  # Optional nonempty revision string.
