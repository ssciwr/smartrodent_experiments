# python scripts/train_classifier.py configs/train_classifier_config.yaml
# One run, or with a `tuning:` section an Optuna study over the tagged values:
#   !suggest-float {low, high, step?, log?} | !suggest-int {low, high, step?, log?}
#   | !suggest-categorical {choices: [...]} (any YAML values).
output_directory: projects/smartrodent_experiments/lightning_classify_augmentation_study  # Study root: one trial_NNNN directory per trial.
train_dataset: datasets/stage8_yolo_classifier_srilanka/train
validation_dataset: datasets/stage8_yolo_classifier_srilanka/val
class_names:
  - Accipiter virgatus
  - Bandicota bengalensis
  - Bandicota indica
  - Canis familiaris
  - Falco tinnunculus
  - Felis catus
  - Glaucidium castanotum
  - Glaucidium radiatum
  - Ketupa nipalensis
  - Ketupa zeylonensis
  - Milvus migrans
  - Mus booduga
  - Mus musculus
  - Naja naja
  - Ninox scutulata
  - Otus thilohoffmanni
  - Pavo cristatus
  - Ptyas mucosa
  - Python molurus
  - Rattus norvegicus
  - Rattus rattus
  - Suncus murinus
  - Tatera indica
  - Tyto javanica
  - Urva edwardsii
  - Vandeleuria oleraceus
encoder:  # {checkpoint: SupCon or classifier .ckpt} | {name, parameters} of an encoder class.
  name: YoloEncoder
  parameters: {model_name: ./yolo26x-cls.pt}
head: linear  # linear (new final layer only) | full (also renew the encoder's post-pooling part)
freeze:  # Nothing frozen: the whole encoder is fine-tuned (BatchNorm statistics adapt).
  prefixes: []
  batchnorm: adapt
# reinitialization:  # Optional: redraw encoder modules randomly.
#   prefixes: [network.model.9]
#   source: random
native_checkpoint: false  # true writes a loadable Ultralytics best.pt (YoloEncoder only).
optimizer: {name: AdamW, parameters: {lr: 0.0005, weight_decay: 0.01}}
scheduler:  # Learning-rate phases (empty list = constant). All but the last set `epochs`.
  - {name: ReduceLROnPlateau, parameters: {factor: 0.5, patience: 2, threshold: 0.001, threshold_mode: abs, min_lr: 0.000001}}
early_stopping: {patience: 10, min_delta: 0.001}  # Native EarlyStopping options | null.
trainer:  # Native lightning.Trainer arguments; max_epochs is required.
  accelerator: gpu
  devices: 1
  max_epochs: 30
  precision: 32-true
  num_sanity_val_steps: 0  # No scoring before the first epoch (it would warn about classes missing from y_true).
batch_size: 36
workers: 15
seed: 42
validation_metrics:  # Named sklearn scorers | null (CE loss only).
  accuracy: {name: accuracy_score}
  balanced_accuracy: {name: balanced_accuracy_score}
  f1_macro: {name: f1_score, parameters: {average: macro, zero_division: 0}}
  f1_micro: {name: f1_score, parameters: {average: micro, zero_division: 0}}
tracked_metric: f1_macro  # ce_loss_mean | a validation_metrics alias.
tracked_mode: max  # min | max | null (infer direction).
transforms:  # Fixed preprocessing, then augmentations in order (torchvision.transforms.v2 classes).
  image_size: &imgsz 448  # Integer >0; square image size.
  resize: {interpolation: bilinear, antialias: true}
  # Probabilities (p) are fixed; magnitudes are searched. A `transforms` list nests augmentation
  # specs (RandomApply etc.); augmentations without their own p are wrapped so each fires
  # independently. RandomErasing runs last so the crop cannot remove it.
  augmentations:
    - name: RandomApply
      parameters:
        p: 0.2
        transforms:
          - name: ColorJitter
            parameters:
              brightness: !suggest-float {low: 0.0, high: 0.5}
              contrast: !suggest-float {low: 0.0, high: 0.5}
              saturation: !suggest-float {low: 0.0, high: 0.5}
              hue: !suggest-float {low: 0.0, high: 0.1}
    - name: RandomApply
      parameters:
        p: 0.2
        transforms:
          - name: GaussianBlur
            parameters:
              kernel_size: 5
              sigma: [0.1, !suggest-float {low: 0.1, high: 2.0}]
    - name: RandomAdjustSharpness
      parameters: {sharpness_factor: !suggest-float {low: 0.0, high: 3.0}, p: 0.2}
    - {name: RandomGrayscale, parameters: {p: 0.2}}
    - name: RandomPerspective
      parameters: {distortion_scale: !suggest-float {low: 0.1, high: 0.8}, p: 0.2, fill: 0}
    - {name: RandomHorizontalFlip, parameters: {p: 0.2}}
    - name: RandomApply
      parameters:
        p: 0.2
        transforms:
          - name: RandomRotation
            parameters: {degrees: !suggest-float {low: 0.0, high: 30.0}}
    - name: RandomApply  # A skipped crop leaves the image at the fixed preprocessing size.
      parameters:
        p: 0.2
        transforms:
          - name: RandomResizedCrop
            parameters:
              size: [*imgsz, *imgsz]
              scale: [!suggest-float {low: 0.3, high: 0.95}, 1.0]
              ratio: !suggest-categorical {choices: [[1.0, 1.0], [0.75, 1.3333333333333333], [0.5, 2.0]]}
              antialias: true
    - name: RandomErasing
      parameters:
        p: 0.2
        scale: [0.02, !suggest-float {low: 0.05, high: 0.33}]
        value: 0
onnx_export: null  # Off for the study (no export per trial); export the winner afterwards. Otherwise {dynamic, simplify}.
mlflow:  # Tracking settings | null (disabled).
  tracking_uri: sqlite:///mlflow.db
  experiment_name: lightning_classify_augmentation_study
  registered_model_name:  # Nonempty model name | null (no registration; keeps trials out of the registry).
  model_artifact_name: species-classifier-xl-augmentation-study
  champion_alias: champion
  dataset_revision: <revision>

tuning:  # Optuna study over the !suggest-* values above.
  study_name: lightning_classify_augmentation_study
  storage: sqlite:///optuna.db
  n_trials: 75
  sampler: {name: TPESampler, parameters: {seed: 42}}
  pruner: {name: MedianPruner, parameters: {n_startup_trials: 5, n_warmup_steps: 3}}
  load_if_exists: true  # true resumes this study on rerun.

logging:  # Console output only: messages matching any regex are hidden there but kept in <output_directory>/training.log.
  suppress:
    - 'Tip: For seamless cloud logging|litlogger'
    - 'module\(s\) in eval mode at the start of training'
