# python scripts/train_classifier.py configs/train_classifier_config.yaml
# One run, or with a `tuning:` section an Optuna study over the tagged values:
#   !suggest-float {low, high, step?, log?} | !suggest-int {low, high, step?, log?}
#   | !suggest-categorical {choices: [...]} (any YAML values).
# !coupled {target, values} follows a !suggest-categorical choice identified by its full
# dotted path. A grid is !suggest-categorical values with sampler BruteForceSampler.
output_directory: runs/classifier_xl_srilanka  # Directory path.
train_dataset: datasets/stage8_yolo_classifier_srilanka/train  # Class-folder split path.
validation_dataset: datasets/stage8_yolo_classifier_srilanka/val  # Split path | null.
class_names:  # List of unique species-directory names.
  - Rattus rattus
  - Rattus norvegicus
  - Bandicota bengalensis
  - Bandicota indica
  - Mus booduga
  - Mus musculus
  - Vandeleuria oleraceus
  - Tatera indica
  - Suncus murinus
  - Ptyas mucosa
  - Python molurus
  - Naja naja
  - Tyto javanica
  - Ninox scutulata
  - Glaucidium radiatum
  - Ketupa zeylonensis
  - Ketupa nipalensis
  - Glaucidium castanotum
  - Otus thilohoffmanni
  - Milvus migrans
  - Accipiter virgatus
  - Falco tinnunculus
  - Urva edwardsii
  - Felis catus
  - Canis familiaris
  - Pavo cristatus

initialization:
  encoder:
    # supcon (SupCon checkpoint) | ultralytics (native YOLO, including trained CE classifiers)
    source: supcon
    # Local checkpoint path; format selected by source.
    checkpoint: /home/hmack/projects/smartrodent_experiments/runs/two_stage_xl_srilanka/supcon/run_001/best.pt
  head:
    replace: !suggest-categorical  # linear (final Linear layer) | full (entire Classify block)
      choices: [linear, full]
    source: !suggest-categorical  # random (fresh weights) | yolo_checkpoint (donor weights)
      choices: [random, yolo_checkpoint]
    checkpoint: !coupled  # null (random) | native YOLO classifier checkpoint path
      target: initialization.head.source  # Full dotted path of the paired choice.
      values:
        - null
        - runs/classify/training/classification/xl_speciesnames_srilanka/full_data_classifier_xl_640/weights/best.pt

# Layer count N (freezes layers 0..N-1) | list of unique layer indices | 0 / [] (train all).
# YOLO26-cls has 11 layers: 0-9 encoder, 10 = Classify head. Index 10 is only valid with
# replace=linear and freezes the head's conv, so only Linear trains (linear probe).
freeze: !coupled  # Linear probe (11) | frozen encoder with trainable full head (10).
  target: initialization.head.replace
  values: [11, 10]
encoder_batchnorm: eval  # Frozen layers' BN: eval (fixed) | adapt (update); omit when nothing is frozen.
epochs: 30  # Integer >0.
batch_size: 48  # Integer >0; single-view CE batch size.
workers: 20  # Integer >=0; 0=main process, >0=worker processes.
device: cuda  # cpu | cuda | cuda:N | another available PyTorch device.
seed: 42  # Integer in [0, 2**32).
transforms:  # torchvision v2 keyword arguments.
  image_size: 640  # Integer >0; square image size.
  resize:
    interpolation: bilinear  # nearest | nearest-exact | bilinear | bicubic
    antialias: true  # true | false
  random_adjust_sharpness:
    sharpness_factor: 0.5  # >=0: 0=blur, 1=unchanged, >1=sharpen.
    p: 0.2  # Probability in [0, 1]: 0=off, 1=always.
  random_grayscale:
    p: 0.2  # Probability in [0, 1].
  random_perspective:
    distortion_scale: 0.5  # Float in [0, 1].
    p: 0.2  # Probability in [0, 1].
    interpolation: bilinear  # nearest | bilinear
    fill: 0  # Scalar or per-channel fill values.
  random_horizontal_flip:
    p: 0.2  # Probability in [0, 1].
  random_resized_crop:
    scale: [0.75, 1.0]  # [min, max] crop-area fractions.
    ratio: [0.75, 1.3333333333333333]  # [min, max] aspect ratios.
    interpolation: bilinear  # nearest | nearest-exact | bilinear | bicubic
    antialias: true  # true | false
train_kwargs:  # Native Ultralytics options; shared paths/batch/device/seed stay at the root.
  optimizer: AdamW  # auto | Adam | Adamax | AdamW | NAdam | RAdam | RMSprop | SGD | MuSGD
  lr0: 0.001  # Positive initial learning rate; auto chooses its own rate.
  momentum: 0.9  # SGD momentum / Adam first-moment decay.
  weight_decay: 0.01  # Nonnegative native weight decay.
  cos_lr: false  # false=linear LR schedule; true=cosine.
  lrf: 0.01  # Final learning rate as a fraction of lr0; 1 keeps it constant after warmup.
  warmup_epochs: 0.0  # Nonnegative warmup duration; fractional epochs are supported.
  patience: 6  # Native early-stopping patience; 0 disables stopping.
  amp: false  # false/fp32=FP32; true/fp16=AMP; bf16=BF16 AMP.
  plots: false  # true writes native diagnostic plots.
validation_metrics:  # Named sklearn scorer specifications | null (CE loss only).
  accuracy:
    function: accuracy_score  # sklearn.metrics function returning a scalar from labels.
  balanced_accuracy:
    function: balanced_accuracy_score
  f1_macro:
    function: f1_score
    average: macro  # binary | micro | macro | weighted
    zero_division: 0  # warn | 0 | 1 | .nan
tracked_metric: balanced_accuracy  # ce_loss_mean | a validation_metrics alias.
tracked_mode: max  # min | max | null (infer direction).
# model_card_template: configs/model_card_template.yaml  # Optional template path.
onnx_export:  # ONNX export of best.pt (class probabilities), written next to best.pt | null (no export).
  dynamic: false  # true | false; true=any batch and image size, false=batch 1 at image_size.
  simplify: true  # true | false; onnxslim graph simplification.

mlflow:  # Tracking settings | null (disabled).
  tracking_uri: sqlite:///mlflow.db  # MLflow tracking URI, e.g. SQLite or HTTP(S).
  experiment_name: two-stage-sri-lanka-xl  # Nonempty experiment-name string.
  registered_model_name: species-classifier-xl  # Nonempty model name | null (no registration).
  model_artifact_name: species-classifier-xl  # Nonempty logged-model name.
  champion_alias: champion  # Nonempty registered-model alias.
  # dataset_revision: <immutable-data-revision>  # Optional nonempty revision string | null.

tuning:  # Optuna study over the tagged values | omit for one run.
  study_name: classifier-head-grid-xl  # Optuna study name; the resume key in persistent storage.
  storage: sqlite:///optuna.db  # Optuna storage URL | null (in-memory, not resumable).
  n_trials: 4  # Integer >0; upper bound, the grid sampler stops after every combination.
  sampler:  # Class name in optuna.samplers and its constructor parameters.
    name: BruteForceSampler  # Tries every head combination once, then stops the study.
    parameters: {seed: 42}
  pruner: null  # Class name in optuna.pruners with parameters | null (never prune).
  load_if_exists: false  # true resumes a stored study of the same name.
