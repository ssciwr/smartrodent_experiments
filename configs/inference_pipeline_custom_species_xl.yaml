# most current speciesnet model
speciesnet_model: kaggle:google/speciesnet/pyTorch/v4.0.3a/1

# SpeciesNet geofencing (ISO 3166-1 alpha-3 and ISO 3166-2 subdivision).
geofence: False
country: USA
admin1_region: CA

# path in MaHaWo/Yolo26Rodent huggingface directory
classifier_weights: yolo_classify_speciesnames/full_data_classifier_xl_with_recommended_defaults/weights/best.pt

inference_pipeline: SpeciesNetYoloInference
# Path may be one image or a directory.
path: /mnt/dataLinux/Development/rodent_experiments/datasets/california_small_animals
output: /home/hmack/Development/rodent_experiments/outputs/inference_custom/xl/california_small_animals
imgs:
  - .jpg
  - .jpeg
  - .png
  - .webdav

specieslist:
  - Rattus rattus
  - Rattus norvegicus
  - Mus musculus
