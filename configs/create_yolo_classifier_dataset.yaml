# Run: python scripts/create_yolo_dataset.py configs/create_yolo_classifier_dataset.yaml
# Reads already-split per-species records.csv files and saves inferred animal crops.
# Paths are relative to the working directory (normally the project root).
creator:
  # Creator class in smartrodent.yolo_dataset_creation, or "module:Class".
  name: YoloClassifierDatasetCreatorFromSpeciesnet
  parameters:  # Shared by every dataset below.
    # null discovers all species; a list selects directories.
    # Ultralytics classification derives its own alphabetical class-index order.
    class_names: null
    # Explicitly use the SpeciesNet version configured on the development branch.
    # Weights load lazily on the first nonempty inference request.
    model_name: kaggle:google/speciesnet/pyTorch/v4.0.3b/1
    batch_size: 64
    confidence_threshold: 0.45
    allowed_classes: [animal]
    iou_threshold: 0.45
datasets:  # One entry per dataset: its input records and output root.
  - path_to_image_data: datasets/stage7_filtered_data_downsampled_50
    dataset_output_path: datasets/stage8_yolo_classifier_50
  - path_to_image_data: datasets/stage7_filtered_data_downsampled_100
    dataset_output_path: datasets/stage8_yolo_classifier_100
  - path_to_image_data: datasets/stage7_filtered_data_downsampled_250
    dataset_output_path: datasets/stage8_yolo_classifier_250
  - path_to_image_data: datasets/stage7_filtered_data_downsampled_500
    dataset_output_path: datasets/stage8_yolo_classifier_500
  - path_to_image_data: datasets/stage7_filtered_data_downsampled_1000
    dataset_output_path: datasets/stage8_yolo_classifier_1000
  - path_to_image_data: datasets/stage7_filtered_data_downsampled_1500
    dataset_output_path: datasets/stage8_yolo_classifier_1500
