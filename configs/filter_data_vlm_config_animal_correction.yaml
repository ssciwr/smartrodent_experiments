backend: vllm # "vllm" (fast, batched, local GPU) or "ollama" (fallback)

paths:
  imgs_root: /home/hmack/projects/smartrodent_experiments/datasets/full_dataset/filtered_undecided
  image_suffixes: [.jpg, .jpeg, .png]

ollama:
  url: http://localhost:11434/api/generate
  model: qwen3.6:35b-a3b
  # model: qwen3-vl:8b

vllm:
  # model: Qwen/Qwen2.5-VL-3B-Instruct
  # model: Qwen/Qwen3.6-27B-FP8
  model:  Qwen/Qwen3.6-35B-A3B
  gpu_memory_utilization: 0.97
  max_model_len: 131072
  max_new_tokens: 300
  max_num_seqs: 138
  batch_size: 24

mode: move
species:
  - Rattus norvegicus
  - Rattus rattus
  - Mus musculus
  - Apodemus agrarius
  - Apodemus flavicollis
  - Apodemus sylvaticus
  - Arvicola amphibius
  - Microtus arvalis
  - Clethrionomys glareolus,
  - Microtus agrestis
  - Crocidura leucodon
  - Sorex araneus
  - Sorex minutus
  - Sorex coronatus
  # rodents in sri lanka
  - Suncus murinus
  - Bandicota indica
  - Bandicota bengalensis
  - Mus booduga
  - Vandeleuria oleraceus
  - Vipera berus # common european adder
  - Coronella austriaca # smooth snake
  - Natrix natrix # grass snake
  - Natrix helvetica # barred grass snake
  - Ptyas mucosa
  - Bungarus caeruleus
  - Naja naja
  - Daboia russelii
  - Coelognathus helena
system_prompt: |
  You are a meticulous wildlife biologist and camera-trap image analyst. You
  have extensive experience reviewing motion-triggered wildlife camera
  photos and know their common artifacts: motion blur, infrared/night-vision
  grain, partial occlusion by vegetation, and false triggers. You only
  report evidence you can actually see in the image and never guess.

prompt: |
  You are classifying wildlife images.

  Return ONLY valid JSON with this exact schema:

  {
    "label": "kept | rejected",
    "visible_animal": true | false
    "evidence_kept": ["string"],
    "evidence_rejected": ["string"],
    "image_quality": "clear | poor | unusable",
    "needs_human_review": true | false
  }

  Rules:
  - label must be exactly one of: "kept" or "rejected".
  - Use "rejected" only for clear evidence of death: carcass, roadkill, skull, bones or preserved/prepared specimen.
  - Use "kept" only if a live animal is visible in a natural or human-built environment.
  - needs_human_review should be true for poor/unusable images, or conflicting
    evidence.
  - Do not include markdown.
  - Do not include text outside the JSON object.
