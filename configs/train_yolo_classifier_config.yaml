# Standalone Ultralytics classifier: scripts/train_yolo.py trains and exports it,
# scripts/tune_yolo.py runs YOLO.tune on it. Keys are passed to Ultralytics under their own names.
task: classify # detect | classify
model: yolo26x-cls.pt
dataset: datasets/stage8_yolo_classifier_srilanka # root holding train/ (and val/, test/)
mlflow: # optional; leave out to switch Ultralytics' MLflow integration off
  tracking_uri: sqlite:///mlflow.db
  train_experiment_name: smartrodent-yolo-classifier-training-with-autoaugment-with-classweighting-xl_speciesnames_448_reduced_augmentation
  tune_experiment_name: smartrodent-yolo-classifier-tuning
train_kwargs: # YOLO.train; `project` and `optimizer` are required
  epochs: 200
  imgsz: &imgsize 448
  batch: 48
  device: 0
  workers: 10
  patience: 10
  warmup_epochs: 3.0
  optimizer: auto
  project: projects/smartrodent_experiments/training/yolo_classify # relative to the working directory (repo root under DVC); also the DVC output
  name: full_data_classifier_xl_speciesnames_448_reduced_augmentation
  exist_ok: true
  plots: true
  save: true
  val: true
  # Closest YOLO classification equivalents to the SupCon transforms.
  scale: 0.25
  fliplr: 0.2
  flipud: 0.0
  # Sharpness, grayscale, and perspective cannot be configured individually for classification.
  auto_augment: null
  erasing: 0.0
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.0
  cls_pw: 0.5
export_kwargs: # YOLO.export; `format` is required
  format: onnx
tune_kwargs: # YOLO.tune; unlisted arguments keep their train_kwargs value
  iterations: 100
  # Only real overrides of train_kwargs belong here (repeating a train value is an error).
  name: full_data_classifier_xl_220_tuning
  project: projects/smartrodent_experiments/tuning/yolo_classify # relative to the working directory (repo root under DVC); also the DVC output
  epochs: 20
  # imgsz: *imgsize # repeated values from train_kwargs are ignored
  # Search space for YOLO.tune: each key is [min, max] (an optional 3rd value is the mutation gain).
  # The tuner mutates values inside these bounds; anything not listed keeps the train_kwargs value.
  # Only arguments that act on classification are listed (no box/cls/dfl losses, mosaic, mixup, ...).
  space:
    # --- optimizer ---
    lr0: [1.0e-05, 0.01] # initial learning rate; IGNORED while optimizer is "auto" (auto picks AdamW + its own lr0)
    lrf: [0.01, 1.0] # final LR as a fraction of lr0 (final_lr = lr0 * lrf) at the end of the schedule
    momentum: [0.5, 0.98] # SGD momentum / Adam beta1; IGNORED while optimizer is "auto" (fixed to 0.9)
    weight_decay: [0.0, 0.01] # L2 regularization strength applied by the optimizer
    warmup_epochs: [0.0, 5.0] # epochs of linear LR/momentum warmup at the start
    warmup_momentum: [0.0, 0.95] # momentum value the warmup starts from before ramping up to `momentum`
    warmup_bias_lr: [0.0, 0.1] # LR for bias params during warmup; forced to 0.0 while optimizer is "auto"
    # --- augmentation and regularization ---
    scale: [0.1, 0.8] # random-resized-crop strength: crop keeps between (1 - scale) and 100 % of the image area
    fliplr: [0.0, 0.5] # probability of a horizontal flip
    flipud: [0.0, 1.0] # probability of a vertical flip (rarely realistic for camera traps; tuner can drive it to 0)
    dropout: [0.0, 0.5] # dropout rate in the classification head
    erasing: [0.0, 0.9] # probability of random erasing (cutout) of an image region
    hsv_h: [0.0, 0.01] # random hue shift, fraction; IGNORED while auto_augment is set (randaugment disables color jitter)
    hsv_s: [0.0, 0.15] # random saturation change, fraction; IGNORED while auto_augment is set
    hsv_v: [0.0, 0.3] # random brightness change, fraction; IGNORED while auto_augment is set
    cls_pw: [0.0, 1.0] # class-weight power for the classification loss
