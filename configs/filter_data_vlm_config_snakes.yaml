backend: vllm # "vllm" (fast, batched, local GPU) or "ollama" (fallback)
taskname: snake
labels: [kept, rejected]
columns:
  photo_id: photo.id
  image_path: image_path

paths:
  input_root: datasets/full_dataset/filtered_stage2_birds
  output_root: datasets/full_dataset/filtered_stage3_snakes

ollama:
  model: qwen3.6:35b-a3b
  # model: qwen3-vl:8b
vllm:
  # model: Qwen/Qwen3.6-35B-A3B
  model: Qwen/Qwen3.8-27B
  gpu_memory_utilization: 0.97
  # max_new_tokens: 500
  batch_size: 4
  # tensor-parallel-size: 8
  max-model-len: 262144
species:
  - Vipera berus
  - Coronella austriaca
  - Natrix natrix
  - Natrix helvetica
  - Ptyas mucosa
  - Bungarus caeruleus
  - Naja naja
  - Daboia russelii
  - Coelognathus helena
system_prompt: |
  You are a meticulous wildlife biologist and expert camera-trap image analyst. You
  have extensive experience reviewing citizen scientist images and know their common artifacts: motion blur, infrared/night-vision
  grain, partial occlusion by objects, dead animals or animal remains being photographed, animals photographed at varying distances. You only
  report evidence you can actually see in the image and never guess.

prompt: |
  You are classifying wildlife images.

  Return ONLY valid JSON with this exact schema:

  {
    "label": "kept | rejected",
    "visible_animal": true,
    "evidence_kept": ["string"],
    "evidence_rejected": ["string"],
    "image_quality": "clear | poor | unusable",
    "needs_human_review": true | false
  }

  Rules:
  - label must be exactly one of: "kept", "rejected".
  - Use "rejected" only for clear evidence is present that the image does not depict a snake, e.g., it's another kind of animal or no animal at all.
  - Use "kept" only if a snake is visible in the image, fully or partially.
  - needs_human_review should be true for poor/unusable images, or conflicting
    evidence.
  - Do not include markdown.
  - Do not include text outside the JSON object.
