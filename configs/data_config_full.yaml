data:
  biotrove:
    metadata_processor_info:
      source_folder: ./datasets/BioTrove/BioTrove
      destination_folder: ./datasets/biotrove-central-europe-large/biotrove-central-europe-large-filtered
      categories: &categories # rodents in europe
        - Rattus norvegicus # brown rat
        - Rattus rattus # black rat
        - Mus musculus # house mouse
        - Apodemus agrarius # striped field mouse
        - Apodemus flavicollis # yellow-necked field mouse
        - Apodemus sylvaticus # wood mouse
        - Arvicola amphibius #
        - Microtus arvalis #
        - Clethrionomys glareolus #
        - Microtus agrestis #
        - Crocidura leucodon #
        - Sorex araneus #
        - Sorex minutus #
        - Sorex coronatus #
        # rodents in sri lanka
        - Suncus murinus #
        - Bandicota indica # greater bandicot rat
        - Bandicota bengalensis # lessert bandicot rat
        - Mus booduga # little indian field mouse
        - Vandeleuria oleraceus #
        # predators of snakes and rodents (birds, mammals )
        - Vulpes vulpes # red fox
        - Buteo buteo # common buzzard
        - Meles meles # european badger
        - Ciconia ciconia # white stork
        - Ardea cinerea # grey heron
        # snakes
        - Vipera berus # common european adder
        - Coronella austriaca # smooth snake
        - Natrix natrix # grass snake
        - Natrix helvetica # barred grass snake
        # snakes in sri lanka
        - Ptyas mucosa #
        - Bungarus caeruleus #
        - Naja naja #
        - Daboia russelii #
        - Coelognathus helena #
        # predators from sri lanka
        - Spilornis cheela
        - Varanus bengalensis #
        - Centropus sinensis #
        - Pavo cristatus # peacock

      category_type: scientificName
    filter_dir: ./datasets/biotrove-central-europe-large/central-europe_parquet
    img_dir: ./datasets/biotrove-central-europe-large/biotrove-central-europe-large/imgs
    metadata_filter_and_shuffle_info:
      species_count_data: ./datasets/biotrove-central-europe-large/biotrove-central-europe-large-filtered/combined_sample_counts_per_species.csv
      directory: ./datasets/biotrove-central-europe-large
      rare_threshold: 5
      cap_threshold: 100000
      part_size: 500
      rare_dir: ./datasets/biotrove-central-europe-large/rare_cases
      cap_filtered_dir_train: ./datasets/biotrove-central-europe-large/tmp_cap_filtered
      capped_dir: ./datasets/biotrove-central-europe-large/overthecap_cases
      merged_dir: ./datasets/biotrove-central-europe-large/processed_metadata
      files_per_chunk: 100
      random_seed: 42
    image_download_info:
      processed_metadata_folder: ./datasets/biotrove-central-europe-large/processed_metadata
      output_folder: ./datasets/biotrove-central-europe-large/img_txt
      start_index: 0
      end_index: null
      concurrent_downloads: 100
    img_text_gen_info:
      processed_metadata_folder: ./datasets/biotrove-central-europe-large/processed_metadata
      img_folder: ./datasets/biotrove-central-europe-large/img_txt
      generate_tar: true
  inaturalist:
    output_path: ./datasets/full_dataset/raw
    years: []
    first_year: 2000
    last_year: 2026
    quality_grade: research
    species: *categories
    seed: 42
    maxlen: 2000
    allowed_licenses:
      - cc0
      - cc-by
      - cc-by-sa
      - cc-by-nc
      - cc-by-nc-sa
  gbif:
    output_path: ./datasets/full_dataset/raw
    years: []
    first_year: 2000
    last_year: 2026
    species: *categories
    seed: 42
    maxlen: 2000
    allowed_licenses:
      creative-commons:
        - cc0
        - cc-by
        - cc-by-sa
        - cc-by-nc
        - cc-by-nc-sa
    media_type: StillImage
